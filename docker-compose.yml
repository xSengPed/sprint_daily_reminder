services:
  # backend deploy แยก stack ของตัวเองใน Portainer (ดู sprint_reminder_backend/docker-compose.yml)
  # Caddy ที่นี่ยิงเข้าไปหา backend ผ่าน host network แทนการ build รวมกัน

  frontend:
    build:
      context: .
      args:
        # /api = ยิงกลับมาที่ origin เดิมแล้วให้ Caddy ส่งต่อไป backend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      # ที่อยู่ backend stack ที่ deploy แยกไว้แล้ว (ปกติคือ host เดียวกัน พอร์ตที่ publish ไว้)
      BACKEND_ADDR: ${BACKEND_ADDR:-host.docker.internal:4000}
    extra_hosts:
      # Linux ต้องเปิดเองถึงจะ resolve host.docker.internal ได้ (Docker 20.10+)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
