services:
  backend:
    build:
      context: ./sprint_reminder_backend
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: ${MONGODB_URI:?ต้องตั้ง MONGODB_URI ในไฟล์ .env}
      MONGODB_DB: ${MONGODB_DB:-sprint_reminder}
      # เรียกผ่าน Caddy ที่ origin เดียวกัน จึงไม่ต้องเปิด CORS ให้ใคร
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      args:
        # /api = ยิงกลับมาที่ origin เดิมแล้วให้ Caddy ส่งต่อไป backend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
